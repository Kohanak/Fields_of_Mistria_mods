"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/62" = "I asked March to craft one based on all the information I gathered about the $Dragonsworn$."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/63" = "I think we should go and get it for you. By all rights, that armor is yours, [Ari]. It may turn out to be the missing piece of the puzzle."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/76" = "Incredible... It's not even the original."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/78" = "It would make sense, wouldn't it? Everything is falling into place."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/79alt" = "To be honest, I wondered whether using modern armor was a good idea. Using something from the same era might have been a prerequisite."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/80" = "I see where you're coming from. But intention can matter too, or the mere presence of magic."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/81" = "Especially since March is an excellent enough craftsman to be touched by magic and able to infuse certain pieces."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/82" = "Although he refuses to admit it"
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/83alt" = "Fair enough, but we're lucky the armor fits me perfectly."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/84" = "Oh, that's because I asked him to. March asked for details, and I told him to base it on you. You're the only person here who goes down into the mines and fights monsters."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/85" = "It's just as I was saying, all the elements are converging."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/86" = "I bet only the true $Dragonsworn$ can read the $Dragonsworn Tablet$."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/87" = "And now you have the proof!"
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/88" = "You certainly look the part, [Ari]."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/89" = "But will you really be able to read the $Tablet$ now?"
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/90" = "I suppose there's only one way to find out."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/91" = "You'd better go back down into the Ruins and see if you can read the $Dragonsworn Tablet$!"
"Cutscenes/Story Events/Mines/ruins_seal/break_ruins_seal_pt_1/53" = "(I understand what she means, but I don't know if saying nothing to Caldarus is the right thing to do. I should go see him and test the waters.)"
"Cutscenes/Story Events/Mines/ruins_seal/break_ruins_seal_pt_3_follow_up_caldarus/4" = "(I didn't even have time to say anything before he had already walked away. It's surely an effect of what happened in the mines.)"