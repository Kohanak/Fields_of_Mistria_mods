"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/31b" = " [Ari], fais attention, s'il te plaît."
"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/31rb" = "Je sais que je me répète, mais j'ai vraiment de la chance de t'avoir. Mais s'il te plaît, [Ari], promets-moi de faire attention."
"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/31fb" = "Mais s'il te plaît, [Ari], promets-moi que tu feras attention."
"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/32b" = "Bien sûr, Caldarus, je ferai attention. C'est promis."
"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/32rb" = "Bien sûr, Cal, je ferai attention. C'est promis."
"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/32fb" = "Bien sûr, Cal, je ferais attention. C'est promis."
"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/33b" = "(J'espère que tout cela sera bientôt derrière nous. Caldarus a besoin de reprendre des forces.)"
"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/33rb" = "(J'espère que tout cela sera bientôt derrière nous. Je veux le voir retrouver toutes ses forces. Je n'aime pas le voir affaibli.)"
"Cutscenes/Story Events/Mines/breaking_the ruins_seal_caldarus/breaking_the_ruins_seal_caldarus_turn_in/33fb" = "(J'espère que tout cela sera bientôt derrière nous. Caldarus a besoin de reprendre des forces.)"
"Cutscenes/Story Events/Mines/dragon_tablet_pt_2/dragon_tablet_pt_2/6" = "Ces deux personnes t'ont aidé ? Je t'en prie, continue..."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/61" = "Je veux dire, une reproduction."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/62" = "J'ai demandé à March d'en concevoir une en se basant sur toutes les informations que j'avais recueillies au sujet du $Paladin du Dragon$."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/63" = "Je pense que nous devrions aller la chercher pour toi. En toute logique, cette armure t'appartient, [Ari]. Elle pourrait bien s'avérer être la pièce manquante du puzzle."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/76" = "Incroyable... Ce n'est même pas l'originale."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/78" = "Cela semblerait logique, n'est-ce pas? Tout les éléments convergent."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/79alt" = "Pour être honnête, je me suis demandé si utiliser une armure moderne était une bonne idée. Utiliser un équipement de la même époque aurait pu être un prérequis."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/80" = "Je comprends pourquoi tu dis ça. Mais l'intention peut aussi avoir son importance, tout comme la simple présence de la magie."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/81" = "D'autant plus que March est un artisan suffisamment accompli pour être touché par la magie et capable d'en imprégner certaines pièces."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/82" = "Bien qu'il refuse de l'admettre."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/83alt" = "C'est vrai, mais on a de la chance que l'armure m'aille parfaitement."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/84" = "Ah, c'est parce que je le lui ai demandé. March voulait des précisions, je lui ai dit de s'inspirer de toi. Tu es la seule personne ici qui va dans les mines pour combattre des monstres."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/85" = "C'est exactement ce que je disais : tous les éléments convergent."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/86" = "Je parie que seul le vrai $Paladin du Dragon$ peut lire la $tablette du Paladin du Dragon$."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/87" = "Et à présent, tu as la preuve nécessaire!"
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/88" = "Tu as la tête de l'emploi, [Ari], c'est certain."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/89" = "Mais est-ce que tu seras capable de lire la $tablette$, maintenant?"
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/90" = "Je crois qu'il n'y a qu'une seule façon de le savoir."
"Cutscenes/Story Events/Mines/dragon_tablet_pt_3/dragon_tablet_pt_3/91" = "Tu ferais bien de retourner dans les ruines et de descendre voir si tu parviens à lire la $tablette du Paladin du Dragon$!"
"Cutscenes/Story Events/Mines/ruins_seal/break_ruins_seal_pt_1/53" = "(Je comprends ce qu'elle veut dire, mais je ne sais pas si ne rien dire à Caldarus est la bonne chose à faire. Je devrais aller le voir et tâter le terrain.)"
"Cutscenes/Story Events/Mines/ruins_seal/break_ruins_seal_pt_3_follow_up_caldarus/4" = "(Je n'ai même pas eu le temps de dire quoi que ce soit qu'il était déjà parti. C'est sûrement une conséquence de ce qui s'est passé dans les mines.)"